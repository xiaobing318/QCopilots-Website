version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-tools:
        dependency-type: development
    ignore:
      # Node.js stays on the pinned 24 line, so its type definitions must match it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # astro check and typescript-eslint pin TypeScript 5 peers, so TypeScript major updates wait for them.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The Pages actions must move together, so one pull request covers every action.
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
